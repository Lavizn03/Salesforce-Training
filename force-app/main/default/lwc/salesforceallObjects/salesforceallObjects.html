<template>
     <div class="slds-p-around_medium">
    <lightning-combobox
        name="objectSelection"
        label="Select an Object"
        value={selectedObject}
        placeholder="Select Object"
        options={objectOptions}
        onchange={handleObjectSelection}
        class="slds-m-bottom_medium"
    ></lightning-combobox>
    
<!-- Button to open Field Selector Modal -->
            <template if:true={selectedObject}>
                <lightning-button
                    class="slds-m-top_small"
                    label="Select Fields"
                    variant="brand"
                    onclick={openFieldModal}>
                </lightning-button>
            </template>


    <template if:true={isModalOpen}>
        <section role="dialog" tabindex="-1" aria-modal="true" aria-labelledby="modal-heading-01"
                 class="slds-modal slds-fade-in-open">
            <div class="slds-modal__container">
                <!-- Header -->
                <header class="slds-modal__header">
                    <h2 id="modal-heading-01" class="slds-text-heading_medium">Select Fields for {selectedObject}</h2>
                    <button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse"
                            title="Close" onclick={closeFieldModal}>
                        <lightning-icon icon-name="utility:close" alternative-text="close" size="small"></lightning-icon>
                    </button>
                </header>

                <!-- Body -->
                <div class="slds-modal__content slds-p-around_medium">
                    <lightning-dual-listbox
                        name = "fieldSelection"
                        label = "Select Fields"
                        source-label="Available Fields"
                        selected-label="Selected Fields"
                        options={fieldOptions}
                        value={selectedFieldAPIs}
                        onchange={handleFieldSelection}
                        class="slds-m-bottom_medium"
                    ></lightning-dual-listbox>
                </div>

                <!-- Footer -->
                <footer class="slds-modal__footer">
                    <lightning-button variant="neutral" label="Cancel" onclick={closeFieldModal}></lightning-button>
                    <lightning-button variant="brand" label="Load Records" onclick={handleFetchRecords}></lightning-button>
                </footer>
            </div>
        </section>
        <div class="slds-backdrop slds-backdrop_open"></div>
    </template>

        <template if:true={showData.length}>
            <lightning-datatable
                key-field="Id"
                data={showData}
                columns={recordColumns}
                draft-values={draftValues}
                onsave={handleSave}
                enable-infinite-loading
                onloadmore={handleLoadMore}
                class="slds-box slds-box_xx-small"
            ></lightning-datatable>
         </template>  
    </div>      
</template>
